name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (Ruff + mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install lint dependencies
        run: |
          pip install ruff mypy
          pip install -r backend/requirements.txt || true

      - name: Ruff – Linting
        run: ruff check backend/ --output-format=github

      - name: Ruff – Formatting check
        run: ruff format backend/ --check

      - name: mypy – Type check
        run: mypy backend/ --ignore-missing-imports --no-error-summary || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: jobhunter
          POSTGRES_DB: jobhunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://jobhunter:jobhunter@localhost:5432/jobhunter_test
      AUTH_ENABLED: "false"
      OLLAMA_BASE_URL: "http://localhost:11434"
      SECRET_KEY: "ci-test-secret-key-not-for-production"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          pip install -r backend/requirements.txt || true

      - name: Run migrations
        run: |
          cd backend
          alembic upgrade head || true

      - name: Run tests
        run: |
          pytest backend/tests/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v \
            || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Coverage summary
        run: |
          echo "### 🧪 Test-Ergebnisse" >> $GITHUB_STEP_SUMMARY
          echo "Coverage-Report als Artifact verfügbar." >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend (TypeScript + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: ESLint
        run: |
          cd frontend
          npm run lint || true

      - name: TypeScript type check
        run: |
          cd frontend
          npm run typecheck || npx tsc --noEmit || true

      - name: Build check
        run: |
          cd frontend
          npm run build
