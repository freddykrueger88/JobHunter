server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;

    # Docker-interner DNS-Resolver: loest "backend" erst pro Request auf,
    # statt beim nginx-Start (sonst crasht der Container hart, falls der
    # Backend-Container beim Frontend-Start noch nicht per DNS aufloesbar ist).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Kein Pfadanteil nach der Variable: die vom Client angefragte URI
        # (inkl. /api/-Praefix) wird unveraendert an das Backend
        # weitergereicht - passend zu den Backend-Routen, die selbst auf
        # /api/... registriert sind.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
