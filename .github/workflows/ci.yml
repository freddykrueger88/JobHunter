name: CI

# Rework-Plan Phase E.1 (docs/analysis/REWORK_PLAN_DE.md): drei Jobs -
# Backend-Tests, Frontend-Lint+Build, i18n-Schluessel-Paritaet. Laeuft erst
# ab Phase A/E, da vorher Backend-Tests (ImportError) und Frontend-Lint
# (fehlende Config) nicht ausfuehrbar waren (Audit-Befund 1.5) - eine
# frueher eingefuehrte CI waere dauerhaft rot gewesen.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        # PYTHONPATH zeigt auf das Repo-Root, analog zu ENV PYTHONPATH=/app
        # im backend/Dockerfile (WORKDIR /app/backend), damit "import
        # backend.*" wie im echten Container aufloest.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

  frontend-checks:
    name: Frontend (Lint + Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  i18n-check:
    name: i18n-Schluesselparitaet (DE/EN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check key parity
        working-directory: frontend
        run: npm run i18n:check
