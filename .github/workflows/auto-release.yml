name: Auto Release on Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}

          # Extract section between this version and the previous one
          NOTES=$(awk "/^## \\[${VERSION}\\]/,/^## \\[/{ if (/^## \\[${VERSION}\\]/) next; if (/^## \\[/ && !/^## \\[${VERSION}\\]/) exit; print }" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Kein CHANGELOG-Eintrag f\u00fcr ${TAG} gefunden."
          fi

          # Write to file to preserve multiline
          echo "$NOTES" > release_notes.md
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Determine if pre-release
        id: prerelease
        run: |
          TAG=${GITHUB_REF_NAME}
          if [[ "$TAG" =~ -alpha|-beta|-rc ]]; then
            echo "is_pre=true" >> $GITHUB_OUTPUT
          else
            echo "is_pre=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: "JobHunter ${{ steps.changelog.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ steps.prerelease.outputs.is_pre }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 🚀 Release erstellt: ${{ steps.changelog.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
